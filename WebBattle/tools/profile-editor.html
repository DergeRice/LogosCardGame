<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>내 프로필 작업실</title>
<style>*{box-sizing:border-box}body{margin:0;background:#17241f;color:#f4f0e4;font:15px system-ui}main{max-width:1080px;margin:auto;padding:32px}h1{margin:6px 0 12px}p{color:#acbdb1;line-height:1.7}button,select,input{font:inherit}button,select{padding:12px;border-radius:10px;border:1px solid #637963;background:#2d4538;color:#fff;cursor:pointer}button:disabled{opacity:.4;cursor:wait}.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin:22px 0}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:32px}canvas{width:100%;max-width:512px;background:#e6e7dc;touch-action:none;border-radius:16px;cursor:grab}aside img{width:180px;height:180px;border-radius:50%;background:#fff;object-fit:cover}label{display:block;margin:16px 0}input[type=range]{width:100%}.primary{background:#bdde80;color:#213019;font-weight:800}.slots{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}.slots img{width:56px;height:56px;border-radius:50%;object-fit:cover}.slots button{display:flex;align-items:center;gap:8px}#status{min-height:28px;color:#d2eda5}small{display:block;color:#acbdb1;margin:14px 0}@media(max-width:700px){main{padding:20px}.workspace{grid-template-columns:1fr}aside{display:flex;flex-direction:column;align-items:start}aside img{width:110px;height:110px}}.add-card{font-size:25px;min-width:48px;padding:5px 12px}.card-library{width:min(860px,96vw);max-height:88dvh;padding:20px;border:1px solid #637963;border-radius:20px;background:#20342a;color:#fff}.card-library::backdrop{background:#101b15b8;backdrop-filter:blur(5px)}.library-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.library-heading h2{margin:0;font-size:19px}.card-library-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:12px;max-height:65dvh;overflow:auto;padding:4px}.card-library-grid button{padding:5px;background:#2d4538}.card-library-grid img{display:block;width:100%;aspect-ratio:488/693;object-fit:contain;border-radius:6px}.card-library-grid span{display:block;font-size:12px;margin-top:5px}canvas.dragging{cursor:grabbing}.crop-hint{margin:8px 0;color:#c2d1c3;font-size:13px}#crop{display:block;aspect-ratio:1;user-select:none;-webkit-user-select:none}
</style>
<main><small>LOCAL · 이 PC 전용</small><h1>내 프로필 작업실</h1><p>이미지를 끌어 위치를 맞추고 확대하세요. 사각형 전체가 저장되며, 게임에서는 원형으로 표시됩니다.</p>
<div class="toolbar"><select id="kind" aria-label="프로필 캐릭터"></select><button id="add-card" class="add-card" aria-label="카드에서 이미지 불러오기" title="카드에서 이미지 불러오기">＋</button><button id="original">원본 카드로 초기화</button><label style="margin:0"><input id="upload" type="file" accept="image/png,image/jpeg,image/webp" aria-label="이미지 가져오기"></label></div>
<div class="workspace"><div><canvas id="crop" width="512" height="512" aria-label="드래그해서 크롭 위치 조정"></canvas><p class="crop-hint">화면을 밀어서 위치 조정 · 슬라이더나 휠로 확대</p><label>확대 <input id="zoom" type="range" min="1" max="4" step="0.01" value="1"></label></div><aside><img id="preview" alt="원형 프로필 미리보기"><small>게임에서 보이는 모습</small><button id="save" class="primary">크롭 저장</button><button id="download" style="margin-top:12px">PNG 다운로드</button><small>저장한 이미지는 아래 목록에 나타납니다.</small></aside></div>
<div id="slots" class="slots"></div><div class="toolbar"><button id="publish" class="primary">저장한 프로필 게임에 반영</button><a href="https://logos-card-battle.netlify.app" target="_blank" rel="noopener" style="color:#bdde80;padding:12px">게임 열기 ↗</a></div><p id="status" role="status"></p><small>편집 페이지는 인터넷에 배포되지 않습니다. ‘게임에 반영’은 저장한 이미지와 게임 프런트엔드를 Netlify에 배포합니다. 편집기 실행: npm run profile-editor</small></main>
<dialog id="card-library" class="card-library" aria-label="현재 카드 이미지 선택"><div class="library-heading"><h2>카드에서 이미지 불러오기</h2><button id="close-library" aria-label="카드 목록 닫기">×</button></div><div id="card-library-grid" class="card-library-grid"></div></dialog>
<script type="module">
const $=id=>document.getElementById(id),canvas=$('crop'),ctx=canvas.getContext('2d');
const config=await(await fetch('/catalog')).json();let image=new Image(),cx=0,cy=0,size=260,baseSize=260,drag=null,loadSerial=0;
for(const [key,c]of Object.entries(config.catalog)){const option=document.createElement('option');option.value=key;option.textContent=c.name;$('kind').append(option);}
function cropSide(){return Math.min(image.width,image.height,size/Number($('zoom').value));}
function draw(){if(!image.width)return;const side=cropSide();cx=Math.max(side/2,Math.min(image.width-side/2,cx));cy=Math.max(side/2,Math.min(image.height-side/2,cy));ctx.clearRect(0,0,512,512);ctx.drawImage(image,cx-side/2,cy-side/2,side,side,0,0,512,512);$('preview').src=canvas.toDataURL('image/png');}
async function load(src,x,y,s){const serial=++loadSerial,next=new Image();next.src=src;await next.decode();if(serial!==loadSerial)return;image=next;cx=x??image.width/2;cy=y??image.height/2;size=s??Math.min(image.width,image.height)*.82;baseSize=size;$('zoom').value='1';draw();}
async function original(){const c=config.catalog[$('kind').value];await load(`/assets/CardImage${c.sheet}.jpg`,config.art.columns[c.col]+($('kind').value==='count'?342:244),config.art.rows[c.row]+($('kind').value==='count'?276:390),$('kind').value==='count'?180:260);}
async function choose(){const saved=config.manifest[$('kind').value];if(saved)await load(saved);else await original();}
function slots(){const box=$('slots');box.replaceChildren();for(const [kind,url]of Object.entries(config.manifest)){const b=document.createElement('button'),img=document.createElement('img');img.src=url;img.alt=config.catalog[kind].name;b.append(img,document.createTextNode(config.catalog[kind].name));b.onclick=()=>{$('kind').value=kind;void choose();};box.append(b);}}
$('kind').onchange=choose;$('original').onclick=original;$('zoom').oninput=draw;
canvas.onpointerdown=e=>{if(!image.width||e.button!==0)return;e.preventDefault();drag={id:e.pointerId,x:e.clientX,y:e.clientY,cx,cy,scale:cropSide()/canvas.getBoundingClientRect().width};canvas.setPointerCapture(e.pointerId);canvas.classList.add('dragging');};
canvas.onpointermove=e=>{if(!drag||drag.id!==e.pointerId)return;e.preventDefault();cx=drag.cx-(e.clientX-drag.x)*drag.scale;cy=drag.cy-(e.clientY-drag.y)*drag.scale;draw();};
const stopDrag=()=>{drag=null;canvas.classList.remove('dragging');};canvas.onpointerup=canvas.onpointercancel=canvas.onlostpointercapture=stopDrag;
canvas.addEventListener('wheel',e=>{e.preventDefault();$('zoom').value=String(Math.max(1,Math.min(4,Number($('zoom').value)+(e.deltaY<0?.1:-.1))));draw();},{passive:false});
const library=$('card-library');$('add-card').onclick=()=>library.showModal();$('close-library').onclick=()=>library.close();
for(const card of config.faces){const button=document.createElement('button'),img=document.createElement('img'),label=document.createElement('span');img.src='/cards/'+card.face+'.webp';img.alt=card.name;img.loading='lazy';label.textContent=card.name;button.append(img,label);button.dataset.face=card.face;button.onclick=async()=>{try{await load(img.src);library.close();$('status').textContent=card.name+' 이미지를 불러왔어요. 위치를 맞춘 뒤 크롭 저장을 누르세요.';}catch{$('status').textContent='카드 이미지를 불러오지 못했어요.';}};$('card-library-grid').append(button);}
$('upload').onchange=async e=>{const file=e.target.files[0];if(!file)return;if(file.size>15e6){$('status').textContent='15MB 이하 이미지를 선택하세요.';return;}const url=URL.createObjectURL(file);try{await load(url);}catch{$('status').textContent='이미지를 열 수 없습니다.';}finally{URL.revokeObjectURL(url);}};
$('save').onclick=async()=>{const kind=$('kind').value;try{const r=await fetch('/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({kind,image:canvas.toDataURL('image/png')})}),data=await r.json();if(!r.ok)throw Error(data.error);config.manifest[kind]=data.url;slots();$('status').textContent='저장했습니다. 모든 프로필을 편집한 뒤 게임에 반영하세요.';}catch(e){$('status').textContent=e.message;}};
$('download').onclick=()=>{const a=document.createElement('a');a.href=canvas.toDataURL('image/png');a.download=$('kind').value+'.png';a.click();};
$('publish').onclick=async()=>{$('publish').disabled=true;$('save').disabled=true;$('status').textContent='빌드하고 Netlify에 반영하는 중…';try{const r=await fetch('/publish',{method:'POST'}),data=await r.json();if(!r.ok)throw Error(data.error);$('status').textContent='반영 완료! 게임을 새로고침하면 새 프로필을 사용합니다.';}catch(e){$('status').textContent=e.message;}finally{$('publish').disabled=false;$('save').disabled=false;}};
slots();await choose();
</script></html>
